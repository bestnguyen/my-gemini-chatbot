<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot FAQ</title>
  <style>
    body { margin: 0; padding: 0; background: transparent; font-family: Arial, sans-serif; }
    #faq-chatbot-container {
      width: 100%;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    #chat-header {
      background: #0073aa;
      color: #fff;
      padding: 12px;
      font-weight: bold;
    }
    #chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .message.user { background: #0073aa; color: #fff; align-self: flex-end; }
    .message.bot { background: #f1f1f1; color: #333; align-self: flex-start; }
    #chat-input-container { display: flex; padding: 10px; border-top: 1px solid #eee; }
    #chat-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
    #chat-input-container button { margin-left: 6px; padding: 8px 12px; background: #0073aa; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div id="faq-chatbot-container">
  <div id="chat-header">Trợ lý FAQ Trực tuyến</div>
  <div id="chat-messages">
    <div class="message bot">Xin chào! Tôi có thể hỗ trợ gì về thông tin lớp học hay các thắc mắc chung?</div>
  </div>
  <div id="chat-input-container">
    <input type="text" id="chat-input" placeholder="Nhập câu hỏi..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">Gửi</button>
  </div>
</div>

<script>
  let chatHistory = [];

  function handleKeyPress(e) { 
    if (e.key === 'Enter') sendMessage(); 
  }

  async function sendMessage() {
    const inputField = document.getElementById('chat-input');
    const userMessage = inputField.value.trim();
    if (!userMessage) return;

    appendMessage(userMessage, 'user');
    inputField.value = '';

    const loadingMessage = appendMessage('Đang xử lý...', 'bot');

    try {
      // Gọi trực tiếp đến Node.js Serverless Function tại /api/chat
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: userMessage,
          history: chatHistory
        })
      });

      const data = await response.json();

      if (data.reply) {
        loadingMessage.textContent = data.reply;
        // Cập nhật lịch sử cuộc trò chuyện
        chatHistory.push({ role: "user", parts: [{ text: userMessage }] });
        chatHistory.push({ role: "model", parts: [{ text: data.reply }] });
      } else {
        loadingMessage.textContent = data.error || "Không thể lấy câu trả lời.";
      }
    } catch (error) {
      loadingMessage.textContent = "Lỗi kết nối máy chủ.";
    }
  }

  function appendMessage(text, sender) {
    const messagesContainer = document.getElementById('chat-messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.textContent = text;
    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    return msgDiv;
  }
</script>

</body>
</html>
