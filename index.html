<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot FAQ</title>
  <style>
    body { margin: 0; padding: 0; background: transparent; font-family: Arial, sans-serif; }
    #faq-chatbot-container {
      width: 100%;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    #chat-header {
      background: #0073aa;
      color: #fff;
      padding: 12px;
      font-weight: bold;
    }
    #chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .message.user { background: #0073aa; color: #fff; align-self: flex-end; }
    .message.bot { background: #f1f1f1; color: #333; align-self: flex-start; }
    #chat-input-container { display: flex; padding: 10px; border-top: 1px solid #eee; }
    #chat-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
    #chat-input-container button { margin-left: 6px; padding: 8px 12px; background: #0073aa; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div id="faq-chatbot-container">
  <div id="chat-header">Trợ lý FAQ Trực tuyến</div>
  <div id="chat-messages">
    <div class="message bot">Xin chào! Tôi có thể hỗ trợ gì về thông tin lớp học hay các thắc mắc chung?</div>
  </div>
  <div id="chat-input-container">
    <input type="text" id="chat-input" placeholder="Nhập câu hỏi..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">Gửi</button>
  </div>
</div>

<script>
  const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"; // Thay API Key của bạn vào đây

  const FAQ_PROMPT = `Bạn là trợ lý tư vấn tự động cho website. Hãy trả lời ngắn gọn, lịch sự dựa trên dữ liệu FAQ sau:
1. Giờ làm việc: 8:00 - 17:00 từ Thứ 2 đến Thứ 6.
2. Phí vận chuyển: Miễn phí cho đơn hàng từ 500.000đ, đơn dưới tính phí 30.000đ.
3. Chính sách đổi trả: Đổi trả trong 7 ngày nếu có lỗi sản xuất.
4. Địa chỉ: 123 Đường ABC, Quận 1, TP. Hồ Chí Minh.

Nếu câu hỏi không thuộc thông tin trên, hãy xin lỗi lịch sự và bảo người dùng gọi Hotline 1900-xxxx.`;

  let chatHistory = [];

  function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

  async function sendMessage() {
    const inputField = document.getElementById('chat-input');
    const userMessage = inputField.value.trim();
    if (!userMessage) return;

    appendMessage(userMessage, 'user');
    inputField.value = '';

    chatHistory.push({ role: "user", parts: [{ text: userMessage }] });

    const loadingMessage = appendMessage('Đang xử lý...', 'bot');
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;

    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: FAQ_PROMPT }] },
          contents: chatHistory
        })
      });

      const data = await response.json();

      if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
        const botReply = data.candidates[0].content.parts[0].text;
        loadingMessage.textContent = botReply;
        chatHistory.push({ role: "model", parts: [{ text: botReply }] });
      } else {
        loadingMessage.textContent = "Không thể lấy câu trả lời.";
        chatHistory.pop();
      }
    } catch (error) {
      loadingMessage.textContent = "Lỗi kết nối API.";
      chatHistory.pop();
    }
  }

  function appendMessage(text, sender) {
    const messagesContainer = document.getElementById('chat-messages');
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.textContent = text;
    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    return msgDiv;
  }
</script>

</body>
</html>
